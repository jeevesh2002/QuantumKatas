name: DevSkim

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # set schedule to run at 2AM PT on Saturdays
    - cron: '0 9 * * Sat'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1
        with:
          # These exact data files contain public provenance hashes and defensive
          # detection patterns, not application credentials or crypto operations.
          # Keep the action's default exclusions and scan all other source files.
          # https://github.com/microsoft/DevSkim-Action#ignore-globs
          ignore-globs: "**/.git/**,**/bin/**,**/.github/codeguard/ci-provenance.json,**/.github/codeguard/ci-semgrep.yml"

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: devskim-results.sarif
